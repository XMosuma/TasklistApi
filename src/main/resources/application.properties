spring.application.name=TasklistApi

# Database Configuration - NO default values for sensitive data
spring.datasource.url=jdbc:postgresql://postgres:5432/tasklist_db
spring.datasource.username= postgres
spring.datasource.password= password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Server Configuration - Can have default for non-sensitive data
server.port=${SERVER_PORT:8081}

# Logging
logging.level.com.example.TasklistApi=${LOG_LEVEL:DEBUG}

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.api-docs.enabled=true

# JWT Configuration - NO default values for sensitive data
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}